<!-- @dsCard group="Colors" viewport="700x140" name="Dark scheme" subtitle="[data-theme="dark"] — the default at night and in shelters" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--md-surface)}.sw{display:flex;flex-direction:column;gap:6px}.chipn{font:var(--type-label-small);letter-spacing:var(--tracking-label-small);color:var(--md-on-surface-variant)}.grid{display:grid;gap:10px}.b{border-radius:var(--shape-sm);height:56px;display:flex;align-items:flex-end;padding:6px 8px;font:var(--type-label-small)}</style>
</head><body><div data-theme="dark" style="background:var(--md-surface);padding:14px;border-radius:var(--shape-md)"><div class="grid" style="grid-template-columns:repeat(5,1fr)"><div class="sw"><div class="b" style="background:var(--md-surface-container);color:var(--md-on-surface);height:56px">Surface</div><span class="chipn" style="color:var(--md-on-surface-variant)">--md-surface-container</span></div><div class="sw"><div class="b" style="background:var(--md-primary);color:var(--md-on-primary);height:56px">Primary</div><span class="chipn" style="color:var(--md-on-surface-variant)">--md-primary</span></div><div class="sw"><div class="b" style="background:var(--md-primary-container);color:var(--md-on-primary-container);height:56px">Container</div><span class="chipn" style="color:var(--md-on-surface-variant)">--md-primary-container</span></div><div class="sw"><div class="b" style="background:var(--md-error);color:var(--md-on-error);height:56px">Error</div><span class="chipn" style="color:var(--md-on-surface-variant)">--md-error</span></div><div class="sw"><div class="b" style="background:var(--status-safe);color:var(--md-on-primary);height:56px">Safe</div><span class="chipn" style="color:var(--md-on-surface-variant)">--status-safe</span></div></div></div></body></html>
