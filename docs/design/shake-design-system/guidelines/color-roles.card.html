<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--md-surface)}.sw{display:flex;flex-direction:column;gap:6px}.chipn{font:var(--type-label-small);letter-spacing:var(--tracking-label-small);color:var(--md-on-surface-variant)}.grid{display:grid;gap:10px}.b{border-radius:var(--shape-sm);height:56px;display:flex;align-items:flex-end;padding:6px 8px;font:var(--type-label-small)}</style>
</head><body><div class="grid" style="grid-template-columns:repeat(4,1fr)">
<div class="sw"><div class="b" style="background:var(--md-primary);color:var(--md-on-primary);height:64px">Primary</div><span class="chipn">--md-primary</span></div><div class="sw"><div class="b" style="background:var(--md-primary-container);color:var(--md-on-primary-container);height:64px">Primary container</div><span class="chipn">--md-primary-container</span></div><div class="sw"><div class="b" style="background:var(--md-secondary);color:var(--md-on-secondary);height:64px">Secondary</div><span class="chipn">--md-secondary</span></div><div class="sw"><div class="b" style="background:var(--md-secondary-container);color:var(--md-on-secondary-container);height:64px">Secondary cont.</div><span class="chipn">--md-secondary-container</span></div></div></body></html>
