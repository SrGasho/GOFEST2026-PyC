<!-- @dsCard group="Colors" viewport="700x140" name="Person status" subtitle="The five lifecycle colours — never used for anything else" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--md-surface)}.sw{display:flex;flex-direction:column;gap:6px}.chipn{font:var(--type-label-small);letter-spacing:var(--tracking-label-small);color:var(--md-on-surface-variant)}.grid{display:grid;gap:10px}.b{border-radius:var(--shape-sm);height:56px;display:flex;align-items:flex-end;padding:6px 8px;font:var(--type-label-small)}</style>
</head><body><div class="grid" style="grid-template-columns:repeat(5,1fr)">
<div class="sw"><div class="b" style="background:var(--status-safe);color:#fff;height:36px"></div><div class="b" style="background:var(--status-safe-container);color:var(--status-on-safe-container);height:44px">Safe</div><span class="chipn">--status-safe</span></div><div class="sw"><div class="b" style="background:var(--status-missing);color:#fff;height:36px"></div><div class="b" style="background:var(--status-missing-container);color:var(--status-on-missing-container);height:44px">Missing</div><span class="chipn">--status-missing</span></div><div class="sw"><div class="b" style="background:var(--status-unconfirmed);color:#fff;height:36px"></div><div class="b" style="background:var(--status-unconfirmed-container);color:var(--status-on-unconfirmed-container);height:44px">Unconfirmed</div><span class="chipn">--status-unconfirmed</span></div><div class="sw"><div class="b" style="background:var(--status-injured);color:#fff;height:36px"></div><div class="b" style="background:var(--status-injured-container);color:var(--status-on-injured-container);height:44px">Injured</div><span class="chipn">--status-injured</span></div><div class="sw"><div class="b" style="background:var(--status-searching);color:#fff;height:36px"></div><div class="b" style="background:var(--status-searching-container);color:var(--status-on-searching-container);height:44px">Searching</div><span class="chipn">--status-searching</span></div></div></body></html>
