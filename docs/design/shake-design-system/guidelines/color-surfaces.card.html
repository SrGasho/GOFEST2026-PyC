<!-- @dsCard group="Colors" viewport="700x120" name="Surfaces" subtitle="Container tint levels, lowest to highest" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--md-surface)}.sw{display:flex;flex-direction:column;gap:6px}.chipn{font:var(--type-label-small);letter-spacing:var(--tracking-label-small);color:var(--md-on-surface-variant)}.grid{display:grid;gap:10px}.b{border-radius:var(--shape-sm);height:56px;display:flex;align-items:flex-end;padding:6px 8px;font:var(--type-label-small)}</style>
</head><body><div class="grid" style="grid-template-columns:repeat(6,1fr)"><div class="sw"><div class="b" style="background:var(--md-surface);color:var(--md-on-surface);border:1px solid var(--md-outline-variant)">surface</div><span class="chipn">--md-surface</span></div><div class="sw"><div class="b" style="background:var(--md-surface-container-lowest);color:var(--md-on-surface);border:1px solid var(--md-outline-variant)">lowest</div><span class="chipn">--md-surface-container-lowest</span></div><div class="sw"><div class="b" style="background:var(--md-surface-container-low);color:var(--md-on-surface);border:1px solid var(--md-outline-variant)">low</div><span class="chipn">--md-surface-container-low</span></div><div class="sw"><div class="b" style="background:var(--md-surface-container);color:var(--md-on-surface);border:1px solid var(--md-outline-variant)">container</div><span class="chipn">--md-surface-container</span></div><div class="sw"><div class="b" style="background:var(--md-surface-container-high);color:var(--md-on-surface);border:1px solid var(--md-outline-variant)">high</div><span class="chipn">--md-surface-container-high</span></div><div class="sw"><div class="b" style="background:var(--md-surface-container-highest);color:var(--md-on-surface);border:1px solid var(--md-outline-variant)">highest</div><span class="chipn">--md-surface-container-highest</span></div></div></body></html>
