<!-- @dsCard group="Colors" viewport="700x110" name="Seismic intensity" subtitle="7-step ramp for maps and shake meters — ground, not people" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--md-surface)}.sw{display:flex;flex-direction:column;gap:6px}.chipn{font:var(--type-label-small);letter-spacing:var(--tracking-label-small);color:var(--md-on-surface-variant)}.grid{display:grid;gap:10px}.b{border-radius:var(--shape-sm);height:56px;display:flex;align-items:flex-end;padding:6px 8px;font:var(--type-label-small)}</style>
</head><body><div class="grid" style="grid-template-columns:repeat(7,1fr)"><div class="sw"><div class="b" style="background:var(--seismic-1);color:#111">1</div><span class="chipn">--seismic-1</span></div><div class="sw"><div class="b" style="background:var(--seismic-2);color:#111">2</div><span class="chipn">--seismic-2</span></div><div class="sw"><div class="b" style="background:var(--seismic-3);color:#111">3</div><span class="chipn">--seismic-3</span></div><div class="sw"><div class="b" style="background:var(--seismic-4);color:#111">4</div><span class="chipn">--seismic-4</span></div><div class="sw"><div class="b" style="background:var(--seismic-5);color:#fff">5</div><span class="chipn">--seismic-5</span></div><div class="sw"><div class="b" style="background:var(--seismic-6);color:#fff">6</div><span class="chipn">--seismic-6</span></div><div class="sw"><div class="b" style="background:var(--seismic-7);color:#fff">7</div><span class="chipn">--seismic-7</span></div></div></body></html>
