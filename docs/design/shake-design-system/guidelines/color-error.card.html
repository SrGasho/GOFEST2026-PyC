<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--md-surface)}.sw{display:flex;flex-direction:column;gap:6px}.chipn{font:var(--type-label-small);letter-spacing:var(--tracking-label-small);color:var(--md-on-surface-variant)}.grid{display:grid;gap:10px}.b{border-radius:var(--shape-sm);height:56px;display:flex;align-items:flex-end;padding:6px 8px;font:var(--type-label-small)}</style>
</head><body><div class="grid" style="grid-template-columns:repeat(4,1fr)"><div class="sw"><div class="b" style="background:var(--md-error);color:var(--md-on-error);height:64px">Error</div><span class="chipn">--md-error</span></div><div class="sw"><div class="b" style="background:var(--md-error-container);color:var(--md-on-error-container);height:64px">Error container</div><span class="chipn">--md-error-container</span></div><div class="sw"><div class="b" style="background:var(--md-caution);color:var(--md-on-caution);height:64px">Caution</div><span class="chipn">--md-caution</span></div><div class="sw"><div class="b" style="background:var(--md-caution-container);color:var(--md-on-caution-container);height:64px">Caution container</div><span class="chipn">--md-caution-container</span></div></div></body></html>
