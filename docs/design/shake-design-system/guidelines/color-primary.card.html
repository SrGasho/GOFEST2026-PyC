<!-- @dsCard group="Colors" viewport="700x120" name="Primary palette" subtitle="Key colour #1B4DFF, tones 10–95" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--md-surface)}.sw{display:flex;flex-direction:column;gap:6px}.chipn{font:var(--type-label-small);letter-spacing:var(--tracking-label-small);color:var(--md-on-surface-variant)}.grid{display:grid;gap:10px}.b{border-radius:var(--shape-sm);height:56px;display:flex;align-items:flex-end;padding:6px 8px;font:var(--type-label-small)}</style>
</head><body><div class="grid" style="grid-template-columns:repeat(10,1fr)"><div class="sw"><div class="b" style="background:var(--p-10);color:#fff">10</div><span class="chipn">--p-10</span></div><div class="sw"><div class="b" style="background:var(--p-20);color:#fff">20</div><span class="chipn">--p-20</span></div><div class="sw"><div class="b" style="background:var(--p-30);color:#fff">30</div><span class="chipn">--p-30</span></div><div class="sw"><div class="b" style="background:var(--p-40);color:#fff">40</div><span class="chipn">--p-40</span></div><div class="sw"><div class="b" style="background:var(--p-50);color:#fff">50</div><span class="chipn">--p-50</span></div><div class="sw"><div class="b" style="background:var(--p-60);color:#fff">60</div><span class="chipn">--p-60</span></div><div class="sw"><div class="b" style="background:var(--p-70);color:#111">70</div><span class="chipn">--p-70</span></div><div class="sw"><div class="b" style="background:var(--p-80);color:#111">80</div><span class="chipn">--p-80</span></div><div class="sw"><div class="b" style="background:var(--p-90);color:#111">90</div><span class="chipn">--p-90</span></div><div class="sw"><div class="b" style="background:var(--p-95);color:#111">95</div><span class="chipn">--p-95</span></div></div></body></html>
