<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Shake app screen" description="A 412×892 Shake phone screen: top app bar, event banner, person registry, FAB and bottom navigation." -->
<helmet><script src="./ds-base.js"></script><style>body{margin:0;background:#E9E7F1;display:grid;place-items:center;min-height:100vh;font-family:"Roboto",system-ui,sans-serif}</style></helmet>
<div style="position:relative;width:412px;height:892px;max-height:100vh;background:#FBF8FF;border:8px solid #111318;border-radius:44px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 4px 4px rgba(0,0,0,.3),0 8px 12px 6px rgba(0,0,0,.15)">
<div style="height:32px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font:500 12px/16px Roboto,sans-serif;letter-spacing:.5px;color:#1A1B21">
<span>04:53</span><span style="display:flex;gap:6px"><span class="shake-icon" style="font-size:15px">signal_cellular_alt</span><span class="shake-icon" style="font-size:15px">wifi</span><span class="shake-icon" style="font-size:15px">battery_5_bar</span></span></div>
<x-import component-from-global-scope="ShakeDesignSystem_bf929b.TopAppBar" title="{{ screenTitle }}" subtitle="{{ screenSubtitle }}" hint-size="100%,64px"></x-import>
<sc-if value="{{ showBanner }}" hint-placeholder-val="{{ true }}">
<x-import component-from-global-scope="ShakeDesignSystem_bf929b.SeismicBar" magnitude="{{ magnitude }}" place="{{ epicentre }}" time="Today 04:12 JST" level="{{ 5 }}" hint-size="100%,56px"></x-import>
</sc-if>
<div style="flex:1;overflow-y:auto">
<div style="padding:16px 16px 8px;font:500 12px/16px Roboto,sans-serif;letter-spacing:.5px;color:#45464F">6 RECORDS · SORTED BY DISTANCE</div>
<sc-for list="{{ people }}" as="p" hint-placeholder-count="4">
<x-import component-from-global-scope="ShakeDesignSystem_bf929b.PersonRow" name="{{ p.name }}" status="{{ p.status }}" lastSeen="{{ p.lastSeen }}" updated="{{ p.updated }}" distance="{{ p.distance }}" hint-size="100%,88px"></x-import>
</sc-for>
</div>
<div style="position:absolute;right:16px;bottom:104px">
<x-import component-from-global-scope="ShakeDesignSystem_bf929b.FAB" icon="person_add" label="Report someone" hint-size="200px,56px"></x-import>
</div>
<x-import component-from-global-scope="ShakeDesignSystem_bf929b.NavigationBar" items="{{ navItems }}" value="{{ navValue }}" onChange="{{ setNav }}" hint-size="100%,80px"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:460,&quot;height&quot;:940},&quot;screenTitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;People nearby&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;screenSubtitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Nagoya · Naka-ku&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;showBanner&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Event&quot;},&quot;magnitude&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;6.4&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Event&quot;},&quot;epicentre&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;12 km NE of Nagoya&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Event&quot;}}">
class Component extends DCLogic {
  state = { nav: 'search' };
  renderVals() {
    const p = this.props;
    return {
      screenTitle: p.screenTitle ?? 'People nearby',
      screenSubtitle: p.screenSubtitle ?? 'Nagoya · Naka-ku',
      showBanner: p.showBanner ?? true,
      magnitude: p.magnitude ?? '6.4',
      epicentre: p.epicentre ?? '12 km NE of Nagoya',
      navValue: this.state.nav,
      setNav: (v) => this.setState({ nav: v }),
      navItems: [
        { value: 'nearby', label: 'Nearby', icon: 'near_me' },
        { value: 'search', label: 'Search', icon: 'person_search' },
        { value: 'alerts', label: 'Alerts', icon: 'notifications', badge: 4 },
        { value: 'me', label: 'Me', icon: 'account_circle' }
      ],
      people: [
        { name: 'Riku Mori', status: 'injured', lastSeen: 'Tsurumai Park first-aid point', updated: '41 min ago', distance: '900 m' },
        { name: 'Mei Tanaka', status: 'missing', lastSeen: 'Sakae 3-chome, Naka-ku', updated: '8 min ago', distance: '1.2 km' },
        { name: 'Sora Yamada', status: 'missing', lastSeen: 'Nishiki 2-chome', updated: '1 hr ago', distance: '1.9 km' },
        { name: 'Aya Sato', status: 'unconfirmed', lastSeen: 'Osu shopping arcade', updated: '22 min ago', distance: '2.4 km' },
        { name: 'Ken Ito', status: 'safe', lastSeen: 'Higashi-ku evacuation centre', updated: 'just now', distance: '3.8 km' },
        { name: 'Hana Kobayashi', status: 'safe', lastSeen: 'Marunouchi station concourse', updated: '1 hr ago', distance: '4.1 km' }
      ]
    };
  }
}
</script>
</body>
</html>
