<!-- @dsCard group="Components" viewport="700x300" name="Actions" subtitle="Buttons, FAB, icon buttons and segmented control" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{padding:20px;background:var(--md-surface);display:flex;align-items:center}#root{width:100%}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.col{display:flex;flex-direction:column;gap:12px}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script><script src="../../_ds_bundle.js"></script></head><body><div id="root"></div>
<script type="text/babel">const {Button, FAB, IconButton, SegmentedButton, Icon} = window.ShakeDesignSystem_bf929b;
function Demo(){const[seg,setSeg]=React.useState('missing');return(<div className="col" style={{gap:16}}>
<div className="row"><Button variant="filled" icon="check_circle">I'm safe</Button><Button variant="tonal">Share</Button><Button variant="elevated">Details</Button><Button variant="outlined">Not now</Button><Button variant="text">Skip</Button><Button variant="danger" icon="delete">Clear report</Button></div>
<div className="row"><Button size="lg" icon="campaign">Broadcast</Button><Button loading>Sending</Button><Button disabled>Disabled</Button><Button variant="outlined" trailingIcon="arrow_forward">Next</Button></div>
<div className="row" style={{gap:20}}><FAB icon="person_add" label="Report someone"/><FAB icon="add"/><FAB icon="my_location" size="small" color="surface"/><FAB icon="sos" color="emergency"/>
<span style={{width:1,height:40,background:'var(--md-outline-variant)'}}/>
<IconButton icon="arrow_back" label="Back"/><IconButton icon="tune" label="Filter" variant="tonal"/><IconButton icon="bookmark" label="Follow" selected/><IconButton icon="share" label="Share" variant="outlined"/></div>
<SegmentedButton value={seg} onChange={setSeg} options={[{value:'all',label:'All'},{value:'missing',label:'Missing'},{value:'safe',label:'Safe'}]}/>
</div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);</script></body></html>
