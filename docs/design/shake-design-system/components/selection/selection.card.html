<!-- @dsCard group="Components" viewport="700x300" name="Selection" subtitle="Switch, checkbox, radio, chips, slider" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{padding:20px;background:var(--md-surface);display:flex;align-items:center}#root{width:100%}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.col{display:flex;flex-direction:column;gap:12px}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script><script src="../../_ds_bundle.js"></script></head><body><div id="root"></div>
<script type="text/babel">const {Switch, Checkbox, RadioButton, Chip, Slider} = window.ShakeDesignSystem_bf929b;
function Demo(){const[on,setOn]=React.useState(true);const[c,setC]=React.useState(true);const[r,setR]=React.useState('family');const[fil,setFil]=React.useState(['missing']);const[v,setV]=React.useState(6);
const t=k=>setFil(f=>f.includes(k)?f.filter(x=>x!==k):[...f,k]);
return(<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'16px 32px'}}>
<div className="col" style={{gap:4}}><Switch label="Share location" checked={on} onChange={setOn}/><Switch label="Alerts paused" checked={false} onChange={()=>{}}/></div>
<div className="col" style={{gap:0}}><Checkbox label="Confirm accuracy" checked={c} onChange={setC}/><Checkbox label="Required consent" checked={false} error onChange={()=>{}}/></div>
<div className="col" style={{gap:0}}><RadioButton value="family" checked={r==='family'} onChange={setR} label="Family member"/><RadioButton value="responder" checked={r==='responder'} onChange={setR} label="Responder"/></div>
<Slider label="Search radius" valueLabel={v+' km'} value={v} min={1} max={20} onChange={setV}/>
<div className="row" style={{gridColumn:'1 / -1'}}>{['Missing','Safe','Injured','Unconfirmed'].map(k=><Chip key={k} type="filter" label={k} selected={fil.includes(k.toLowerCase())} onClick={()=>t(k.toLowerCase())}/>)}
<Chip type="assist" icon="near_me" label="Within 2 km"/><Chip type="input" label="Sakae 3-chome" onRemove={()=>{}}/><Chip type="suggestion" label="Shelters only"/></div>
</div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);</script></body></html>
